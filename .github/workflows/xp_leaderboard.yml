name: Run Tibia XP Tracker

on:
  scheduled:
    - cron: '0 3 * * *' # Runs daily at 3:00 AM (adjust as needed)
  workflow_dispatch:      # Allows manual trigger from GitHub UI

jobs:
  track-xp:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run XP Scraper
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python scrape_xp_tab9.py

      - name: Commit and push changes if any
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add xp_log.json post_state.json streaks.json personal_bests.json
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "🤖 Auto-update XP logs and streaks [skip ci]"
            git push
          else
            echo "No changes detected, skipping commit."
          fi
