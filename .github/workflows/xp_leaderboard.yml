name: Tibia XP Tracker

on:
  repository_dispatch:
    types: [run-xp-scraper]
  workflow_dispatch: # Allows manual triggers from GitHub UI anytime

jobs:
  track-xp:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run XP Scraper Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scrape_xp_tab9.py

      - name: Commit and push state changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add totals.json xp_log.json post_state.json streaks.json personal_bests.json
          git diff-index --quiet HEAD || git commit -m "auto: update Tibia XP tracking state"
          git push
